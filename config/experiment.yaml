# Main experiment configuration. Fill in every REPLACE_ value during Weeks 4-5,
# then freeze in Week 8 (python -m scripts.freeze). Do not edit after the freeze.

run_dir: runs/main
scenarios_dir: data/scenarios
unrelated_tasks: data/unrelated_tasks.json

# One neutral system prompt for every model and condition (record it in the preregistration).
system_prompt: "You are a helpful assistant."

n_subsequent_turns: 6            # Section 21
reps_phase_a: 2                  # repetitions per attack/benign scenario
reps_phase_b: 2                  # Section 25.2
clean_reps: 5                    # clean trajectories per matched task (Section 25.2)
clean_control_conditions: [P3]   # Section 16: clean-summary control CLEAN_P3, the fair baseline for P3 (CLEAN is
                                 # the baseline for P1). P2 and P4 have no fair baseline for task correctness:
                                 # the document is gone, so it is not compared for them.
target_states_per_model: 40      # Section 24
constructed_max_attempts: 3
cross_task_conditions: [P2, P3]  # same-topic AND unrelated tasks (Section 24)
default_task_type: same_topic    # task type used for P1 and P4

# Generation settings (Section 25.1): leave `settings` WITHOUT temperature/top_p so the
# provider default is used. Only include what the API requires (e.g. max tokens).
# Record the documented default values in `documented_defaults` for the report.
models:
  - name: api_model_1
    provider: anthropic
    model_id: REPLACE_WITH_EXACT_DATED_MODEL_ID
    settings: {max_tokens: 1024}
    documented_defaults: {temperature: REPLACE, top_p: REPLACE, source_url: REPLACE}
    price_per_million_tokens: {input: 0.0, output: 0.0}   # REPLACE from pricing page
  - name: api_model_2
    provider: openai
    model_id: REPLACE_WITH_EXACT_DATED_MODEL_ID
    settings: {max_completion_tokens: 1024}
    documented_defaults: {temperature: REPLACE, top_p: REPLACE, source_url: REPLACE}
    price_per_million_tokens: {input: 0.0, output: 0.0}
  - name: api_model_3
    provider: google
    model_id: REPLACE_WITH_EXACT_MODEL_ID
    settings: {max_output_tokens: 1024}
    documented_defaults: {temperature: REPLACE, top_p: REPLACE, source_url: REPLACE}
    price_per_million_tokens: {input: 0.0, output: 0.0}
  - name: open_weight
    provider: openai_compatible          # e.g. a vLLM server: vllm serve <checkpoint>
    base_url: http://localhost:8000/v1
    model_id: REPLACE_WITH_CHECKPOINT_NAME
    settings: {max_tokens: 1024}         # recommended defaults from the model card go here if the server does not apply them
    documented_defaults: {temperature: REPLACE, top_p: REPLACE, source_url: REPLACE}
    checkpoint_hash: REPLACE
    inference_stack: {framework: vllm, version: REPLACE, quantization: none, gpu: REPLACE}
    price_per_million_tokens: {input: 0.0, output: 0.0}

# Judge (Section 20): ideally a model that is NOT one of the evaluated models.
judge_model:
  name: judge
  provider: anthropic
  model_id: REPLACE_WITH_EXACT_MODEL_ID
  settings: {max_tokens: 200, temperature: 0}
  price_per_million_tokens: {input: 0.0, output: 0.0}
judge_max_rows: null             # set a number to cap judge cost
